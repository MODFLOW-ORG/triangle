name: triangle checks
on:
  # run at 6 AM UTC every day
  schedule:
    - cron: '0 6 * * *' 
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  PIXI_BETA_WARNING_OFF: true
  DIST: dist-path
  PROGRAM_NAME: triangle
  # oldest macOS the release runs on, independent of the runner image
  MACOSX_DEPLOYMENT_TARGET: '15.0'
jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.compiler }} ${{ matrix.version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # gcc (conda-forge, from the gcc pixi environment)
          - {os: ubuntu-22.04, compiler: gcc, version: 15, shell: bash, release: no, environment: gcc}
          - {os: macos-15, compiler: gcc, version: 15, shell: bash, release: yes, environment: gcc, xcode-version: '16.4'}
          - {os: windows-2022, compiler: gcc, version: 15, shell: pwsh, release: no, environment: gcc}
          # clang (Apple clang from Xcode)
          - {os: macos-15, compiler: clang, version: 17, shell: bash, release: no, environment: default, xcode-version: '16.4'}
          # intel
          - {os: ubuntu-22.04, compiler: intel, version: "2025.0", shell: bash, release: yes, environment: default}
          - {os: windows-2022, compiler: intel, version: "2025.0", shell: pwsh, release: yes, environment: default}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout ${{ env.PROGRAM_NAME }}
        uses: actions/checkout@v7
        with:
          path: ${{ env.PROGRAM_NAME }}

      - name: Setup ${{ matrix.compiler }} ${{ matrix.version }} on ${{ matrix.os }}
        if: matrix.compiler == 'intel'
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: ${{ matrix.compiler}}
          version: ${{ matrix.version }}

      - name: Set xcode version (macOS)
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode-version }}

      - name: Set CC (clang)
        if: matrix.compiler == 'clang'
        run: echo "CC=clang" >> $GITHUB_ENV

      # setup-fortran sets CC=cl on Windows, which builds with MSVC
      - name: Set CC (Windows intel)
        if: ${{ runner.os == 'Windows' && matrix.compiler == 'intel' }}
        run: echo "CC=icx" >> $env:GITHUB_ENV

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.82.1
          manifest-path: "${{ env.PROGRAM_NAME }}/pixi.toml"
          environments: ${{ matrix.environment }}

      - name: Show compiler (macOS)
        if: runner.os == 'macOS'
        working-directory: ${{ env.PROGRAM_NAME }}
        run: |
          xcode-select -p
          pixi run -e ${{ matrix.environment }} bash -c '$CC --version' | sed -n 1p

      - name: Set ostag
        shell: bash
        working-directory: ${{ env.PROGRAM_NAME }}
        id: ostag
        run: |
          echo "ostag=$(pixi run -e ${{ matrix.environment }} get-ostag)" >> $GITHUB_ENV

      # static link libgcc
      - name: Set LDFLAGS (macOS gcc)
        if: ${{ runner.os == 'macOS' && matrix.compiler == 'gcc' }}
        run: |
          ldflags="$LDFLAGS -static-libgcc"
          echo "LDFLAGS=$ldflags" >> $GITHUB_ENV

      - name: Build ${{ env.PROGRAM_NAME }}
        working-directory: ${{ env.PROGRAM_NAME }}
        run: |
          pixi run -e ${{ matrix.environment }} setup
          pixi run -e ${{ matrix.environment }} build

      - name: Check architecture and minimum macOS (macOS)
        working-directory: ${{ env.PROGRAM_NAME }}/bin
        if: runner.os == 'macOS'
        run: |
          otool -L triangle
          lipo -info triangle
          otool -L ../lib/libtriangle.dylib
          if otool -L triangle ../lib/libtriangle.dylib | grep 'libgcc_s'; then
            echo "error: binaries dynamically link the gcc runtime library"
            exit 1
          fi
          lipo -info ../lib/libtriangle.dylib
          for file in triangle ../lib/libtriangle.dylib; do
            minos=$(otool -l "$file" | awk '/LC_BUILD_VERSION/ {found = 1} found && $1 == "minos" && !done {print $2; done = 1}')
            echo "$file: minimum macOS $minos"
            if [ "$minos" != "$MACOSX_DEPLOYMENT_TARGET" ]; then
              echo "$file: minimum macOS $minos differs from MACOSX_DEPLOYMENT_TARGET $MACOSX_DEPLOYMENT_TARGET"
              exit 1
            fi
          done

      - name: Show build log
        if: failure()
        working-directory: ${{ env.PROGRAM_NAME }}
        run: cat builddir/meson-logs/meson-log.txt
      
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}-${{ matrix.compiler}}-${{ matrix.version }}-meson-log.txt
          path: ${{ env.PROGRAM_NAME }}/builddir/meson-logs/meson-log.txt
    
      - name: Unit test ${{ env.PROGRAM_NAME }}
        if: success()
        working-directory: ${{ env.PROGRAM_NAME }}
        run: |
          pixi run -e ${{ matrix.environment }} test
      
      - name: Show test log
        if: failure()
        working-directory: ${{ env.PROGRAM_NAME }}
        run: cat builddir/meson-logs/testlog.txt

      - name: Create source zip file on Linux
        if: ${{ matrix.release == 'yes' && runner.os == 'Linux' }}
        working-directory: ${{ env.PROGRAM_NAME }}
        run: |
          zip -r ${{ env.PROGRAM_NAME }}_source.zip LICENSE README.md meson.build src/ test/A.poly test/test_library.c
          ls -lha *.zip

      - name: Create zip file on MacOS and Linux
        if: ${{ matrix.release == 'yes' && runner.os != 'Windows' }}
        working-directory: ${{ env.PROGRAM_NAME }}
        run: |
          # the executable and the library in bin/, as get-modflow expects
          if [ "$RUNNER_OS" = macOS ]; then libext=dylib; else libext=so; fi
          stage="$RUNNER_TEMP/archive"
          mkdir -p "$stage/bin"
          cp bin/triangle "lib/libtriangle.$libext" "$stage/bin/"
          cp -R include "$stage/"
          (cd "$stage" && zip -r "$OLDPWD/${ostag}.zip" bin include)
          unzip -l ${ostag}.zip

      - name: Create zip file on Windows
        if: ${{ matrix.release == 'yes' && runner.os == 'Windows' }}
        working-directory: ${{ env.PROGRAM_NAME }}
        run: |
          $ZipFileName = "$env:ostag.zip"
          Compress-Archive -Path "bin", "lib", "include" -DestinationPath $ZipFileName
          ls *.zip

      - name: Upload distribution archive
        if: matrix.release == 'yes'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DIST }}-${{ matrix.os }}
          path: ${{ env.PROGRAM_NAME }}/*.zip

  release-notes:
    name: Check release note items
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Check release note items
        run: python3 scripts/release_notes.py check

  release:
    name: Make release
    needs: [build, release-notes]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          path: ${{ env.PROGRAM_NAME }}

      - name: Extract version number from the main meson.build file
        working-directory: ${{ env.PROGRAM_NAME }}
        run: |
          echo "PROGRAM_VERSION=$(grep -oE "([0-9]{1,}\.)+[0-9]{1,}" meson.build | head -n 1)" >> $GITHUB_ENV          

      - name: Write release description
        if: github.event_name == 'workflow_dispatch'
        working-directory: ${{ env.PROGRAM_NAME }}
        run: python3 scripts/release_notes.py notes --version "$PROGRAM_VERSION" > release-notes.md

      - name: Download distribution
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ env.DIST }}*
          merge-multiple: true
          path: ${{ env.DIST }} 

      - name: List distribution files
        run: ls -l ${{ env.DIST }} 

        # create new release if manual trigger
      - name: Create release
        if: github.event_name == 'workflow_dispatch'
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ env.PROGRAM_VERSION }}
          name: "${{ env.PROGRAM_NAME }} ${{ env.PROGRAM_VERSION }}"
          artifacts: "${{ env.DIST }}/*"
          bodyFile: "${{ env.PROGRAM_NAME }}/release-notes.md"
          draft: false
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
