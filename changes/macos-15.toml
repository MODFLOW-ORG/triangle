section = "build"
description = """The macOS executable and library require macOS 15 or later; the 1.6 macarm.zip ran on macOS 14 (#35). The minimum is now set explicitly rather than by the build machine's macOS version, so a newer build machine does not raise it (#48). Building on an older macOS has not been tested, but since Triangle is standard C it should work from source with Meson (pixi run setup and pixi run build), which targets the macOS it is built on; use a gcc such as Homebrew's (CC=gcc-13), not Apple's gcc command, which is clang, so that meson.build sets the same compiler options as the release."""
