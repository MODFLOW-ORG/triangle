section = "features"
description = """Triangle is also built as a library, libtriangle, which a program can call in memory instead of running the executable with files, and which another Meson project can build as a subproject (#39). triangulate_status() returns an error status instead of ending the program and restores the caller's floating-point control word; triangle_free() frees the arrays it returns; and triangle_version(), triangle_release_version(), and triangle_copyright() report Triangle's version, this repository's release, and Triangle's copyright notice. Include triangle_status.h."""
