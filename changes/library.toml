section = "features"
description = """Triangle is also built as a library, libtriangle, which a program can call in memory instead of running the executable with files, and which another Meson project can build as a subproject (#39). triangulate_status() returns an error status instead of ending the program and restores the caller's floating-point control word, and the library reports Triangle's version, the release, and Triangle's copyright notice. The headers are triangle.h and triangle_status.h."""
